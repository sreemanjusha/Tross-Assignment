spring.application.name=linkedin-profile-api
server.port=${PORT:8080}

linkedin.li-at=${LINKEDIN_LI_AT:}
linkedin.jsessionid=${LINKEDIN_JSESSIONID:}
linkedin.profile-decoration=${LINKEDIN_PROFILE_DECORATION:com.linkedin.voyager.dash.deco.identity.profile.FullProfileWithEntities-101}
linkedin.user-agent=${LINKEDIN_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36}
linkedin.timeout-seconds=${UPSTREAM_TIMEOUT_SECONDS:20}

api.key=${API_KEY:}

spring.jackson.serialization.indent-output=true
